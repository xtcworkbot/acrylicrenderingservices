<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<title>Mobile Preview — Acrylic Rendering Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink:   #EC2074;
    --pinklt: #FFB3CD;
    --ink:    #0B0B0D;
    --cream:  #FAF6EE;
    --lime:   #D4ED2A;
    --mute:   #9C939E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--pink);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .grain {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.15 0 0 0 0 0.08 0 0 0 0 0.10 0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .frame {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    padding: 96px 80px;
    gap: 56px;
  }

  /* TOP — brand */
  .brand {
    display: flex; align-items: center; gap: 22px;
  }
  .brand-mark {
    width: 88px; height: 88px; border-radius: 999px;
    background: var(--ink); color: var(--pink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-weight: 400; font-size: 46px;
    position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6px; border: 2.5px solid var(--lime); border-radius: 999px;
  }
  .brand-name {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 42px; letter-spacing: 0.02em; color: var(--ink);
    text-transform: uppercase; line-height: 1;
  }

  .overline {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase; font-size: 18px;
    color: var(--ink);
    display: flex; align-items: center; gap: 14px;
  }
  .hairline-ink { display: inline-block; width: 72px; height: 2px; background: var(--ink); }

  /* HEADLINE */
  .headline {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 196px; line-height: 0.92; letter-spacing: -0.005em;
    text-transform: uppercase;
  }
  .headline .a { color: var(--ink); display: block; }
  .headline .b { color: var(--cream); display: block; }
  .headline .c { display: block; color: var(--ink); }
  .headline .c .lime {
    background: var(--lime);
    padding: 0 14px;
    display: inline-block;
  }

  /* IMAGE */
  .photo {
    position: relative; border-radius: 24px; overflow: hidden;
    border: 4px solid var(--ink);
    isolation: isolate;
    box-shadow: 0 40px 90px -30px rgba(11,11,13,0.55);
    aspect-ratio: 16/10;
    width: 100%;
  }
  .photo img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 65%;
  }
  .ph-stamp {
    position: absolute; left: 28px; bottom: 28px;
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    color: var(--cream); letter-spacing: 0.20em; text-transform: uppercase; font-size: 20px;
    background: rgba(11,11,13,0.82); padding: 12px 18px; border-radius: 10px;
    z-index: 3;
  }
  .badge {
    position: absolute; top: -30px; right: -30px; z-index: 3;
    width: 220px; height: 220px; border-radius: 999px;
    background: var(--lime); color: var(--ink);
    border: 4px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    text-align: center; transform: rotate(-10deg);
    box-shadow: 0 28px 56px -16px rgba(11,11,13,0.6);
  }
  .badge .v1 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 50px; line-height: 0.95; letter-spacing: -0.005em;
    text-transform: uppercase;
  }
  .badge .v2 {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 16px; letter-spacing: 0.22em; margin-top: 8px;
  }

  /* BOTTOM — call block */
  .bottom {
    margin-top: auto;
    background: var(--ink); color: var(--cream);
    border-radius: 24px; padding: 48px 56px;
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
  }
  .stars {
    color: var(--lime); font-size: 56px; letter-spacing: 6px; line-height: 1;
  }
  .reviews-label {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase; font-size: 20px;
    color: var(--pinklt); margin-top: 14px;
  }
  .phone {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 68px; color: var(--lime); letter-spacing: -0.005em;
    line-height: 1;
  }
  .phone small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; letter-spacing: 0.22em; color: var(--pinklt); margin-bottom: 8px;
    font-weight: 500; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="frame">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div>
        <div class="brand-name">Acrylic Rendering<br/>Services</div>
      </div>
    </div>

    <div class="overline">
      <span class="hairline-ink"></span> PRECISION IN EVERY LAYER · SYDNEY
    </div>

    <h1 class="headline">
      <span class="a">Acrylic</span>
      <span class="b">Render,</span>
      <span class="c">By <span class="lime">Hand.</span></span>
    </h1>

    <div class="photo">
      <img src="assets/unnamed.webp" alt="" />
      <div class="badge">
        <div>
          <div class="v1">5.0★<br/>RATED</div>
          <div class="v2">21 REVIEWS</div>
        </div>
      </div>
      <span class="ph-stamp">SYDNEY · 2026</span>
    </div>

    <div class="bottom">
      <div>
        <div class="stars">★★★★★</div>
        <div class="reviews-label">5.0 · 21 GOOGLE REVIEWS</div>
      </div>
      <div class="phone">
        <small>CALL ANDRES</small>
        0432 036 006
      </div>
    </div>
  </div>
</body>
</html>
