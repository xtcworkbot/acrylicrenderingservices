<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<title>OG Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0D0C0A;
    --surface: #161410;
    --line: #2A261F;
    --text: #EEE7D7;
    --muted: #A39B89;
    --accent: #DC6B2F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .atmosphere {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(70% 70% at 90% 0%, rgba(220, 107, 47, 0.32), transparent 60%),
      radial-gradient(50% 60% at 0% 110%, rgba(220, 107, 47, 0.10), transparent 65%),
      var(--bg);
  }
  .grain {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.91 0 0 0 0 0.84 0 0 0 0.85 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .frame {
    position: absolute; inset: 0; z-index: 2;
    display: grid; grid-template-columns: 720px 1fr;
    padding: 56px 64px;
    gap: 48px;
    align-items: stretch;
  }

  .left { display: flex; flex-direction: column; justify-content: space-between; }

  .brand {
    display: flex; align-items: center; gap: 14px;
  }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 10px;
    background: #0D0C0A; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 22px; letter-spacing: 0.04em;
  }
  .overline {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
  }
  .trowel-mark {
    display: inline-block; width: 22px; height: 6px; background: var(--accent);
    transform: skewX(-30deg);
  }

  .headline {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 140px; line-height: 0.86; letter-spacing: -0.015em;
    margin-top: 16px;
  }
  .headline .a { color: var(--text); display: block; }
  .headline .b { color: var(--accent); display: block; }
  .headline .c { display: block; }
  .headline .ital {
    font-family: 'Oswald', sans-serif; font-style: italic; font-weight: 400;
    text-transform: lowercase; margin-right: 14px;
  }

  .bottom {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 32px;
  }
  .stars-row {
    display: flex; align-items: center; gap: 14px;
  }
  .stars {
    color: var(--accent); font-size: 32px; letter-spacing: 4px;
  }
  .reviews-label {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; font-size: 13px;
    color: var(--muted);
  }
  .phone {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800;
    font-size: 32px; color: var(--text);
  }
  .phone small {
    display: block;
    font-size: 11px; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 4px;
    font-weight: 700;
  }

  .right {
    position: relative; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line);
    isolation: isolate;
  }
  .right img {
    width: 100%; height: 100%; object-fit: cover;
    filter: saturate(0.9) contrast(1.05);
  }
  .right::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, transparent 50%, rgba(13,12,10,0.75) 100%),
      linear-gradient(160deg, rgba(220,107,47,0.16), transparent 60%);
    mix-blend-mode: multiply;
  }
  .ph-stamp {
    position: absolute; left: 16px; bottom: 16px;
    font-family: 'Big Shoulders Display'; font-weight: 700;
    color: var(--text); letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px;
    background: rgba(13,12,10,0.7); padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); backdrop-filter: blur(6px);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="atmosphere"></div>
  <div class="grain"></div>

  <div class="frame">
    <div class="left">
      <div>
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 64 64" width="30" height="30">
              <path d="M14 42 L32 16 L50 42 Z" fill="none" stroke="#DC6B2F" stroke-width="4" stroke-linejoin="round"/>
              <rect x="20" y="44" width="24" height="4" fill="#DC6B2F"/>
            </svg>
          </span>
          <span class="brand-name">ALL CEMENT RENDERING</span>
        </div>

        <h1 class="headline">
          <span class="a">CEMENT</span>
          <span class="b">RENDERING</span>
          <span class="c"><span class="ital">across</span>SYDNEY.</span>
        </h1>
      </div>

      <div class="bottom">
        <div>
          <div class="stars-row">
            <div class="stars">★★★★★</div>
          </div>
          <div class="reviews-label" style="margin-top: 8px;">16 GOOGLE REVIEWS · OWNER-OPERATED</div>
        </div>
        <div class="phone">
          <small>CALL TODAY</small>
          0410 997 788
        </div>
      </div>
    </div>

    <div class="right">
      <img src="assets/2022-01-01 (1).webp" alt="" />
      <span class="ph-stamp">SYDNEY · 2022</span>
    </div>
  </div>
</body>
</html>
