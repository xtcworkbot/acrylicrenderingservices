<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<title>OG Preview — Acrylic Rendering Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink:    #EC2074;
    --pinklt:  #FFB3CD;
    --ink:     #0B0B0D;
    --cream:   #FAF6EE;
    --lime:    #D4ED2A;
    --mute:    #9C939E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--pink);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  .grain {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.15 0 0 0 0 0.08 0 0 0 0 0.10 0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .frame {
    position: absolute; inset: 0; z-index: 2;
    display: grid; grid-template-columns: 720px 1fr;
    padding: 56px 64px;
    gap: 48px;
    align-items: stretch;
  }

  .left { display: flex; flex-direction: column; justify-content: space-between; }

  .brand {
    display: flex; align-items: center; gap: 14px;
  }
  .brand-mark {
    width: 50px; height: 50px; border-radius: 999px;
    background: var(--ink); color: var(--pink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-weight: 400; font-size: 26px;
    position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 4px; border: 1.5px solid var(--lime); border-radius: 999px;
  }
  .brand-name {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 26px; letter-spacing: 0.02em; color: var(--ink);
    text-transform: uppercase;
  }
  .overline {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; font-size: 12px;
    color: var(--ink);
    display: flex; align-items: center; gap: 10px;
    margin-top: 28px;
  }
  .hairline-ink {
    display: inline-block; width: 48px; height: 1.5px; background: var(--ink);
  }

  .headline {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 116px; line-height: 0.93; letter-spacing: -0.005em;
    text-transform: uppercase;
    margin-top: 18px;
  }
  .headline .a { color: var(--ink); display: block; }
  .headline .b { color: var(--cream); display: block; }
  .headline .c { display: block; color: var(--ink); }
  .headline .c .lime {
    background: var(--lime);
    padding: 0 8px;
    display: inline-block;
  }

  .bottom {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 32px;
  }
  .stars-row {
    display: flex; align-items: center; gap: 14px;
  }
  .stars {
    color: var(--ink); font-size: 32px; letter-spacing: 4px;
  }
  .reviews-label {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase; font-size: 12px;
    color: var(--ink);
  }
  .phone {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 38px; color: var(--ink); letter-spacing: -0.005em;
  }
  .phone small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; color: var(--ink); margin-bottom: 4px;
    font-weight: 500; text-transform: uppercase;
  }

  .right {
    position: relative; border-radius: 14px; overflow: hidden;
    border: 2px solid var(--ink);
    isolation: isolate;
    box-shadow: 0 24px 60px -28px rgba(11,11,13,0.55);
  }
  .right img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 60%;
  }
  .ph-stamp {
    position: absolute; left: 14px; bottom: 14px;
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    color: var(--cream); letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px;
    background: rgba(11,11,13,0.78); padding: 6px 10px; border-radius: 6px;
    backdrop-filter: blur(6px);
    z-index: 3;
  }
  .badge {
    position: absolute; top: -16px; left: -16px; z-index: 3;
    width: 114px; height: 114px; border-radius: 999px;
    background: var(--lime); color: var(--ink);
    border: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    text-align: center; transform: rotate(-10deg);
    box-shadow: 0 18px 36px -12px rgba(11,11,13,0.6);
  }
  .badge .v1 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 24px; line-height: 0.95; letter-spacing: -0.005em;
    text-transform: uppercase;
  }
  .badge .v2 {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 9px; letter-spacing: 0.18em; margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="grain"></div>

  <div class="frame">
    <div class="left">
      <div>
        <div class="brand">
          <span class="brand-mark">A</span>
          <span class="brand-name">Acrylic Rendering Services</span>
        </div>

        <div class="overline"><span class="hairline-ink"></span> PRECISION IN EVERY LAYER · SYDNEY</div>

        <h1 class="headline">
          <span class="a">Acrylic</span>
          <span class="b">Render,</span>
          <span class="c">By <span class="lime">Hand.</span></span>
        </h1>
      </div>

      <div class="bottom">
        <div>
          <div class="stars-row">
            <div class="stars">★★★★★</div>
          </div>
          <div class="reviews-label" style="margin-top: 8px;">5.0 · 21 GOOGLE REVIEWS · OWNER-OPERATED</div>
        </div>
        <div class="phone">
          <small>CALL ANDRES</small>
          0432 036 006
        </div>
      </div>
    </div>

    <div class="right">
      <img src="assets/unnamed.webp" alt="" />
      <div class="badge">
        <div>
          <div class="v1">5.0★<br/>RATED</div>
          <div class="v2">21 REVIEWS</div>
        </div>
      </div>
      <span class="ph-stamp">SYDNEY · 2026</span>
    </div>
  </div>
</body>
</html>
